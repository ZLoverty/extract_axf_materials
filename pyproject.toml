[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extract-axf-materials"
version = "0.1.0"
description = "Extract material maps and color info from AXF files."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "zhengyang" }
]
dependencies = [
  "h5py",
  "numpy",
  "Pillow",
]

[project.scripts]
extract-axf-materials = "extract_axf_materials:main"

[tool.setuptools]
py-modules = ["extract_axf_materials"]
